:root{

  --accent:#A21A19; --accent-ink:#FFFFFF; --accent-soft:#F8E6E5; --bar:#A21A19; --bar-ink:#FFFFFF;

  --f-body:'Helvetica Now Text','Helvetica Neue',Helvetica,Arial,sans-serif;

}

  --ok:#6CCB8F; --ok-soft:#183223; --warn:#FFA24D; --warn-soft:#3B2711; --bad:#FF7A92; --bad-soft:#40181F;
  --side:#121111; --side-ink:#B9B6B4; --side-act:#2A2827; --side-mark:#FF8300;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161515; --surface:#201F1F; --ink:#EDEBEA; --muted:#A8A5A3; --line:#383635;
  --accent:#FF8300; --accent-ink:#1F1000; --accent-soft:#3A2410; --bar:#7E1413; --bar-ink:#FFFFFF;
  --ok:#6CCB8F; --ok-soft:#183223; --warn:#FFA24D; --warn-soft:#3B2711; --bad:#FF7A92; --bad-soft:#40181F;
  --side:#121111; --side-ink:#B9B6B4; --side-act:#2A2827; --side-mark:#FF8300;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.banner{background:var(--warn-soft);color:var(--warn);font-size:12px;padding:6px 16px;text-align:center}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 68px)}
nav.side{background:var(--side);color:var(--side-ink);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;align-self:start;height:calc(100vh - 68px);overflow:auto}
.brand{font:700 18px/1.1 var(--f-display);color:#fff;padding:4px 10px 18px}
.brand small{display:block;font:500 11px var(--f-mono);color:var(--side-ink);letter-spacing:.06em;margin-top:6px;text-transform:uppercase}
nav.side a{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--side-ink);text-decoration:none;padding:9px 10px;border-radius:6px;font-weight:500}
nav.side a:hover{background:var(--side-act);color:#fff}
nav.side a[aria-current="page"]{background:var(--side-act);color:#fff;box-shadow:inset 3px 0 0 var(--side-mark)}
nav.side .badge{font:500 11px var(--f-mono);background:var(--bad);color:#fff;border-radius:99px;padding:1px 8px}
.side .foot{margin-top:auto;font-size:12px;padding:10px;color:var(--side-ink);opacity:.8}
main{padding:24px clamp(16px,3vw,36px) 56px;min-width:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
h1{font:700 28px/1.1 var(--f-display);margin:0;letter-spacing:-.015em}
.pagehead p{margin:4px 0 0;color:var(--muted)}
h2{font:700 17px var(--f-display);margin:0 0 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.grid{display:grid;gap:16px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;gap:2px;text-decoration:none;color:inherit}
a.tile:hover{border-color:var(--accent)}
.tile b{font:700 32px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.tile.bad b{color:var(--bad)}.tile.warn b{color:var(--warn)}
.two{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.bars{display:grid;gap:14px}
.bar-row{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:13px}
.bar{display:flex;height:18px;border-radius:4px;overflow:hidden;background:var(--bg)}
.bar i{display:block;height:100%}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;background:var(--c)}
.c-ok{background:var(--ok)}.c-warn{background:var(--warn)}.c-bad{background:var(--bad)}
.items{display:grid;gap:0}
.item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;align-items:center}
.item:first-child{border-top:0}.item:hover .t{color:var(--accent)}
.item .t{font-weight:600}.sub{color:var(--muted);font-size:12px}
.folio{font:500 12px var(--f-mono)}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px var(--f-body);padding:2px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-warn{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--bad-soft);color:var(--bad)}.p-mute{background:var(--bg);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:600 13px var(--f-body);text-decoration:none;border-radius:6px;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.45;cursor:default}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.filters input[type=search]{flex:1 1 240px}
textarea{width:100%;font:12px/1.5 var(--f-mono);resize:vertical}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px 12px;background:var(--bg);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:top}
tbody tr.click{cursor:pointer}tbody tr.click:hover{background:var(--accent-soft)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pager{display:flex;justify-content:space-between;align-items:center;padding-top:12px;color:var(--muted);flex-wrap:wrap;gap:8px}
.pager div{display:flex;gap:8px}
form.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
@media (max-width:760px){form.f{grid-template-columns:1fr}}
.field{display:grid;gap:4px}.field.full{grid-column:1/-1}
.field label{font-weight:600;font-size:12px}
.field .err{color:var(--bad);font-size:12px;min-height:0}
.field input.bad,.field select.bad{border-color:var(--bad)}
.hint{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pdfbox{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--line);border-radius:8px;padding:12px 14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:50;max-width:calc(100% - 32px)}
.progress{height:8px;background:var(--bg);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.stack{display:grid;gap:16px}
.crumb{color:var(--muted);font-size:13px;margin-bottom:10px}
.crumb a{color:var(--accent);text-decoration:none;cursor:pointer}

.switch{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:40px;background:var(--bar);color:var(--bar-ink);padding:6px 16px;font:600 13px var(--f-body)}

.switch a:hover{background:rgba(255,255,255,.2)}
.switch a[aria-current="page"]{background:var(--bar-ink);color:var(--bar)}

<script>

const CFG0={diasAviso:90,drive:"https://drive.google.com/drive/folders/1YVRabAWkaYT_85OnrK-wGQN_6p82RNB7",

const clone=o=>JSON.parse(JSON.stringify(o));
let S;
function load(){try{const r=localStorage.getItem(KEY);if(r){const o=JSON.parse(r);if(o&&o.items)return o}}catch(e){}
  return {items:clone(window.CONVENIOS_EJEMPLO),cfg:clone(CFG0)}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const HOY=new Date(), DAY=864e5;
const fmt=d=>d?new Date(d+"T00:00:00").toLocaleDateString("es-MX",{day:"2-digit",month:"short",year:"numeric"}):"—";
function est(c){const d=Math.round((new Date(c.fin+"T00:00:00")-HOY)/DAY);
  if(d<0)return{k:"bad",t:"Vencido",d};if(d<=S.cfg.diasAviso)return{k:"warn",t:"Vence en "+d+" d",d};return{k:"ok",t:"Vigente",d}}
const pillPdf=c=>c.pdf==="ok"?'<span class="pill p-ok">PDF localizado</span>':'<span class="pill p-bad">PDF no localizado</span>';
const TIPOS=["Local","Nacional","Internacional"], SECT=["Educativo","Gubernamental","Empresarial","Salud","Social","Cultural"];

function pillEst(c){const e=est(c);return `<span class="pill p-${e.k}">${e.t}</span>`}
function nextFolio(tipo,year){const p=`${PRE[tipo]}-${year}-`;let n=0;S.items.forEach(c=>{if(c.folio.startsWith(p))n=Math.max(n,+c.folio.slice(p.length)||0)});return p+String(n+1).padStart(3,"0")}

function catalogo(){
  $("#view").innerHTML=`<div class="pagehead"><div><h1>Catálogo de convenios</h1><p>Busca por folio, institución u objeto y filtra por tipo, sector, vigencia o PDF.</p></div><a class="btn" href="#alta">Nuevo convenio</a></div>
  <div class="filters">

    <select id="ct" aria-label="Tipo"><option value="">Todos los tipos</option>${TIPOS.map(t=>`<option ${cat.tipo===t?"selected":""}>${t}</option>`).join("")}</select>
    <select id="cs" aria-label="Sector"><option value="">Todos los sectores</option>${SECT.map(t=>`<option ${cat.sector===t?"selected":""}>${t}</option>`).join("")}</select>
    <select id="cv" aria-label="Vigencia"><option value="">Toda vigencia</option><option value="ok" ${cat.vig==="ok"?"selected":""}>Vigentes</option><option value="warn" ${cat.vig==="warn"?"selected":""}>Por vencer</option><option value="bad" ${cat.vig==="bad"?"selected":""}>Vencidos</option></select>
    <select id="cp" aria-label="PDF"><option value="">PDF: todos</option><option value="ok" ${cat.pdf==="ok"?"selected":""}>Con PDF</option><option value="falta" ${cat.pdf==="falta"?"selected":""}>Sin PDF</option></select>
  </div><div id="tbl"></div>`;
  const apply=()=>{cat.q=$("#cq").value;cat.tipo=$("#ct").value;cat.sector=$("#cs").value;cat.vig=$("#cv").value;cat.pdf=$("#cp").value;cat.page=1;table()};
  ["#cq","#ct","#cs","#cv","#cp"].forEach(s=>$(s).oninput=apply);
  table();
}
function table(){
  const q=norm(cat.q.trim()),PER=15;
  const rows=S.items.filter(c=>(!cat.tipo||c.tipo===cat.tipo)&&(!cat.sector||c.sector===cat.sector)&&(!cat.vig||est(c).k===cat.vig)&&(!cat.pdf||c.pdf===cat.pdf)&&
    (!q||q.split(/\s+/).every(w=>norm([c.folio,c.institucion,c.objeto].join(" ")).includes(w)))).sort((a,b)=>a.folio.localeCompare(b.folio));
  const pages=Math.max(1,Math.ceil(rows.length/PER));cat.page=Math.min(cat.page,pages);
  const sl=rows.slice((cat.page-1)*PER,cat.page*PER);
  $("#tbl").innerHTML=`<div class="tablewrap"><table><thead><tr><th>Folio</th><th>Institución</th><th>Tipo</th><th>Objeto</th><th>Fin</th><th>Vigencia</th><th>PDF</th></tr></thead><tbody>`+
    (sl.length?sl.map(c=>`<tr class="click" data-open="${c.folio}"><td class="folio">${c.folio}${c.revision?' <span class="pill p-warn">Revisar</span>':""}</td><td><b>${esc(c.institucion)}</b><div class="sub">${c.sector}</div></td><td>${c.tipo}</td><td>${esc(c.objeto)}</td><td class="num">${fmt(c.fin)}</td><td>${pillEst(c)}</td><td>${c.pdf==="ok"?'<span class="pill p-ok">Sí</span>':'<span class="pill p-bad">Falta</span>'}</td></tr>`).join(""):`<tr><td colspan="7" class="sub" style="text-align:center;padding:32px">Ningún convenio coincide con los filtros.</td></tr>`)+
    `</tbody></table></div><div class="pager"><span>${rows.length} convenios · página ${cat.page} de ${pages}</span><div><button class="btn ghost sm" id="pv" ${cat.page<=1?"disabled":""}>Anterior</button><button class="btn ghost sm" id="nx" ${cat.page>=pages?"disabled":""}>Siguiente</button></div></div>`;
  $("#pv").onclick=()=>{cat.page--;table()};$("#nx").onclick=()=>{cat.page++;table()};
  document.querySelectorAll("#tbl [data-open]").forEach(r=>r.onclick=()=>openDetail(r.dataset.open));
}

const MUESTRA=`CL-2026-901\tLocal\tCentro Comunitario El Mirador\tSocial\tServicio social y voluntariado\t01/11/2026\t01/11/2029\tLic. J. Hernández
CN-2026-902\tNacional\tInstituto de Tecnología Aplicada del Norte\tEducativo\tMovilidad académica de estudiantes\t2026-11-15\t2028-11-15\tDr. M. Cortés
CI-2026-903\tInternacional\tUniversity of Eastern Lakes\tEducativo\tEstancias de investigación\t10/01/2027\t10/01/2030\tDra. R. Salinas
CL-2026-904\tLocal\tTaller Escuela Metálica\tEmpresarial\tPrácticas profesionales\t05/12/2026\t05/12/2025\tMtro. L. Vega
CX-2026-905\tRegional\tAsociación de Comerciantes Unidos\tEmpresarial\tBolsa de trabajo\t01/12/2026\t01/12/2028\tLic. P. Domínguez`;
function parseDate(s){s=(s||"").trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m){const n=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(!n)return null;m=[0,n[3],n[2].padStart(2,"0"),n[1].padStart(2,"0")]}
  const d=new Date(`${m[1]}-${m[2]}-${m[3]}T00:00:00`);return isNaN(d)||d.getMonth()+1!==+m[2]?null:`${m[1]}-${m[2]}-${m[3]}`}
function parseMasiva(text){
  const seen=new Set(S.items.map(c=>c.folio));
  return text.split(/\r?\n/).filter(l=>l.trim()).map((l,i)=>{
    const p=(l.includes("\t")?l.split("\t"):l.split(";")).map(x=>x.trim());
    const [folio,tipo,inst,sector,objeto,a,b,resp]=p;const err=[];
    if(p.length<7)err.push("Faltan columnas");
    if(!folio)err.push("Sin folio");else if(seen.has(folio))err.push("Folio repetido");
    if(!TIPOS.includes(tipo))err.push("Tipo no válido");
    if(!inst)err.push("Sin institución");
    const fa=parseDate(a),fb=parseDate(b);if(!fa)err.push("Inicio no válido");if(!fb)err.push("Fin no válido");if(fa&&fb&&fb<=fa)err.push("Fin anterior al inicio");
    if(folio)seen.add(folio);
    return{n:i+1,err,c:{folio,tipo,institucion:inst,sector:SECT.includes(sector)?sector:"Social",objeto:objeto||"",inicio:fa,fin:fb,responsable:resp||"",pdf:"falta",pdfArchivo:folio+".pdf",revision:false}}});
}
function masiva(){
  $("#view").innerHTML=`<div class="pagehead"><div><h1>Alta masiva</h1><p>Copia las filas desde Excel y pégalas aquí.</p></div></div>
  <div class="stack"><div class="panel"><div class="hint" style="margin-bottom:8px">Orden de columnas: Folio, Tipo, Institución, Sector, Objeto, Inicio, Fin, Responsable. Las fechas pueden venir como 31/12/2026 o 2026-12-31.</div>
  <textarea id="m_t" rows="8" placeholder="Pega aquí las filas copiadas de Excel…" aria-label="Filas de Excel">${esc(mas.text)}</textarea>
  <div class="actions" style="margin-top:10px"><button class="btn" id="m_p">Revisar filas</button><button class="btn ghost" id="m_e">Cargar ejemplo</button><button class="btn ghost" id="m_c">Limpiar</button></div></div>
  <div id="m_r"></div></div>`;
  const show=()=>{const R_=mas.rows;if(!R_.length){$("#m_r").innerHTML="";return}
    const ok=R_.filter(r=>!r.err.length).length;
    $("#m_r").innerHTML=`<div class="panel"><div class="actions" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Vista previa: ${ok} listos, ${R_.length-ok} con errores</h2><button class="btn" id="m_i" ${ok?"":"disabled"}>Importar ${ok} convenios</button></div>
    <div class="tablewrap"><table><thead><tr><th>Fila</th><th>Folio</th><th>Institución</th><th>Tipo</th><th>Vigencia</th><th>Estado</th></tr></thead><tbody>${R_.map(r=>`<tr><td>${r.n}</td><td class="folio">${esc(r.c.folio)}</td><td>${esc(r.c.institucion)}</td><td>${esc(r.c.tipo)}</td><td class="num">${fmt(r.c.inicio)} – ${fmt(r.c.fin)}</td><td>${r.err.length?`<span class="pill p-bad">${esc(r.err.join(", "))}</span>`:'<span class="pill p-ok">Listo</span>'}</td></tr>`).join("")}</tbody></table></div></div>`;
    const bi=$("#m_i");if(bi)bi.onclick=()=>{const add=R_.filter(r=>!r.err.length).map(r=>r.c);S.items.push(...add);save();mas={text:"",rows:[]};toast(add.length+" convenios importados");location.hash="#catalogo"}};
  $("#m_p").onclick=()=>{mas.text=$("#m_t").value;mas.rows=parseMasiva(mas.text);show()};
  $("#m_e").onclick=()=>{$("#m_t").value=MUESTRA;mas.text=MUESTRA;mas.rows=parseMasiva(MUESTRA);show()};
  $("#m_c").onclick=()=>{mas={text:"",rows:[]};masiva()};
  show();
}

  $("#view").innerHTML=`<div class="pagehead"><div><h1>Auditoría de PDFs</h1><p>Convenios cuyo PDF no se localizó en las carpetas configuradas.</p></div><button class="btn" id="scan">Volver a escanear carpetas</button></div>

  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDetail(b.dataset.open));
  $("#scan").onclick=()=>{$("#scan").disabled=true;$("#sc").hidden=false;let p=0;const iv=setInterval(()=>{p+=12;$("#scb").style.width=Math.min(p,100)+"%";$("#sct").textContent="Escaneando carpetas… "+Math.min(p,100)+"%";
    if(p>=100){clearInterval(iv);let f=0;miss.forEach((c,i)=>{if(i%3===0){c.pdf="ok";f++}});save();toast(f?f+" PDFs encontrados en el escaneo":"No se encontraron PDFs nuevos");go()}},220)};
}

  <div class="panel"><h2>Datos de ejemplo</h2><p class="sub" style="margin:0 0 10px">Los cambios de este boceto se guardan solo en este equipo. Puedes volver a los 90 convenios originales.</p><button class="btn danger" id="rs">Restaurar datos de ejemplo</button></div></div>`;
  document.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>toast("En la aplicación final se abre el selector de carpetas de Windows"));
  $("#cf").onsubmit=e=>{e.preventDefault();TIPOS.forEach(t=>c.carpetas[t]=$("#k_"+t).value.trim());c.diasAviso=Math.max(1,+$("#k_d").value||90);c.drive=$("#k_g").value.trim();save();toast("Configuración guardada")};
  let sure=false;$("#rs").onclick=function(){if(!sure){sure=true;this.textContent="Confirmar: se perderán los cambios";return}
    S={items:clone(window.CONVENIOS_EJEMPLO),cfg:clone(CFG0)};save();toast("Datos restaurados");go()};
